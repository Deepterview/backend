name: 📋 작업
description: 팀 내부에서 진행할 작업/할 일을 등록합니다.
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: overview
    attributes:
      label: 작업 개요
      description: 어떤 작업인지 간단히 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 세부 작업 항목을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: 완료 조건 (Definition of Done)
      description: 이 작업이 완료됐다고 판단할 수 있는 기준을 작성해주세요.
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 관련 이슈 / PR
      description: "연관된 이슈나 PR 번호가 있다면 작성해주세요. (예: #12)"
    validations:
      required: false
