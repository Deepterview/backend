name: 🐛 버그 리포트
description: 발생한 버그를 보고합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 순서를 단계별로 작성해주세요.
      placeholder: |
        1. '...'로 이동
        2. '...' 클릭
        3. '...' 요청 전송
        4. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 예상 동작
      description: 원래 어떻게 동작해야 하는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: 실제 동작
      description: 실제로 어떻게 동작했는지 설명해주세요.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - 로컬
        - 개발(dev)
        - 스테이징
        - 운영(prod)
        - 기타
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 / 스크린샷
      description: 에러 로그, 스택트레이스, 스크린샷 등이 있다면 첨부해주세요.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 컨텍스트
      description: 그 외 참고할 만한 내용이 있다면 작성해주세요.
    validations:
      required: false
