name: ✨ 기능 요청
description: 새로운 기능이나 개선 사항을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 해결하려는 문제 / 배경
      description: 왜 이 기능이 필요한지, 어떤 문제를 해결하는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 기능
      description: 제안하는 기능이나 개선 방향을 구체적으로 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법을 고려해봤다면 어떤 것들이 있었는지, 왜 이 방식을 선택했는지 적어주세요.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 컨텍스트
      description: 참고 자료, 관련 이슈, 스크린샷 등이 있다면 첨부해주세요.
    validations:
      required: false
