spring:
  application:
    name: deepterview
  profiles:
    include: secret

  datasource:
    url: jdbc:mysql://localhost:3306/deepterview?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: '0000'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  config:
    import: optional:application-secret.yml

management:
  metrics:
    distribution:
      percentiles-histogram:
        llm.call.duration: true
  http:
    client:
      connect-timeout: 3s
      read-timeout: 20s

resilience4j:
  circuitbreaker:
    instances:
      claude:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      tavily:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      claude:
        max-attempts: 2
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      tavily:
        max-attempts: 2
        wait-duration: 500ms
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  pattern:
    level: "%5p [%X{requestId}]"
  level:
    org.hibernate.SQL: debug

app:
  file:
    upload-dir: /uploads
    answer-storage-dir: storage/answers
  oauth2:
    redirect-success-url: ${OAUTH2_REDIRECT_SUCCESS_URL:http://localhost:3000/oauth2/success}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}

  # OAuth2 client 설정 값은 application-secret.yml 에서 불러옵니다.
