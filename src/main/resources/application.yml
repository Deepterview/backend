spring:
  application:
    name: deepterview

  datasource:
    url: jdbc:mysql://localhost:3306/deepterview?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: '0000'
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  config:
    import: optional:application-secret.yml

  http:
    client:
      connect-timeout: 3s
      read-timeout: 20s

  ai:
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          max-tokens: 2048

  security:
    oauth2:
      client:
        registration:
          # 구글 로그인 설정
          google:
            client-id: ${GOOGLE_CLIENT_ID:747791685924-rgbjeg5hpnj1052e20q40e423dg36iof.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope:
              - email
              - profile

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        llm.call.duration: true
  http:
    client:
      connect-timeout: 3s
      read-timeout: 20s

resilience4j:
  circuitbreaker:
    instances:
      claude:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      tavily:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      claude:
        max-attempts: 2
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      tavily:
        max-attempts: 2
        wait-duration: 500ms
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

logging:
  pattern:
    level: "%5p [%X{requestId}]"
  level:
    org.hibernate.SQL: OFF
    org.springframework.security.oauth2: DEBUG
    com.capstone.deepterview.domain.member: DEBUG

tavily:
  api-key: ${TAVILY_API_KEY}
  base-url: ${TAVILY_BASE_URL:https://api.tavily.com}

app:
  file:
    upload-dir: /uploads
    answer-storage-dir: storage/answers
    portfolio-storage-dir: storage/portfolios
  oauth2:
    redirect-success-url: ${OAUTH2_REDIRECT_SUCCESS_URL:http://localhost:5173/oauth2/success}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
